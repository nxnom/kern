<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kern</title>
    <meta
      name="description"
      content="A kerning workbench a browser agent can operate. Load a font, watch an agent even out the spacing between letters, and export a real font with GPOS kerning."
    />
    <meta name="theme-color" content="#16150f" />
    <meta name="color-scheme" content="light" />
    <link rel="apple-touch-icon" href="/icon.svg" />
  </head>
  <body>
    <script>
      // Recorded before the bundle loads, so we can tell a browser that ships
      // WebMCP natively from one where @mcp-b/global installed the polyfill.
      window.__KERN_NATIVE_WEBMCP__ =
        typeof document !== 'undefined' && 'modelContext' in document
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
